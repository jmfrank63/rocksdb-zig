on:
    pull_request:
    push:
      branches:
        - master 
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
        
      - name: setup-zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: lint
        run: |
          zig fmt --check src/ build.zig

  test:
    runs-on: [self-hosted, ghr-base-win]
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v2

      - name: setup-zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: test (default - full C++ API)
        run: |
          zig build --release=fast test

      - name: test C-API-only static
        run: |
          zig build --release=fast -Denable_c_api_static=true

      - name: test C-API-only shared (Windows)
        run: |
          zig build --release=fast -Denable_c_api_shared=true

      - name: test with Snappy (Windows)
        run: |
          zig build --release=fast -Denable_snappy=true test

      - name: test with MSVC compiler
        run: |
          zig build --release=fast -Dtarget=native-windows-msvc -Duse_msvc_compiler=true test
